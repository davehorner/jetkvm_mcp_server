[package]
name = "jetkvm_mcp_server"
version = "0.1.0"
edition = "2021"

[dependencies]
jetkvm_client = "1.0.0"
rmcp = { version = "0.8.1", features = ["server", "macros", "transport-io"] }
tokio = { version = "1", features = ["full"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
anyhow = "1.0"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
schemars = "1.0"
rustls = { version = "0.23", features = ["aws-lc-rs"], default-features = false }
aws-lc-rs = "1.14"
base64 = "0.22"
image = "0.25"
